AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  CommunityFridgeMapApi

  SAM Template for CommunityFridgeMapApi

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Api:
    BinaryMediaTypes:
      - image/webp
  Function:
    Timeout: 60
    MemorySize: 512

Parameters:
  Environment:
    Type: String
    Description: Choose between local or AWS
    AllowedValues:
      - local
      - aws
  Stage:
    Type: String
    Description: Choose between dev, staging, prod
    AllowedValues:
      - dev
      - staging
      - prod
  CFMHostedZoneId:
    Type: String
    Description: Grab the HostedZoneId from Route53 console

##########################
##    Resources    ##
##########################
Resources:
  ApiCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub api-${Stage}.communityfridgefinder.com
      DomainValidationOptions:
       - DomainName: !Sub api-${Stage}.communityfridgefinder.com
         HostedZoneId: !Sub ${CFMHostedZoneId}
      ValidationMethod: DNS
  ApiGatewayApi:
      Type: AWS::Serverless::Api
      Properties:
        StageName: !Ref Stage
        # CORS preflight settings from https://vercel.com/guides/how-to-enable-cors
        Cors:
          AllowMethods: "'GET,OPTIONS,PATCH,DELETE,POST,PUT'"
          AllowHeaders: "'X-CSRF-Token, X-Requested-With, Accept, Accept-Version, Content-Length,
            Content-MD5, Content-Type, Date, X-Api-Version'"
          AllowOrigin: "'*'"
          MaxAge: "'86400'"
          AllowCredentials: false
        EndpointConfiguration: REGIONAL
        Domain:
          DomainName: !Sub api-${Stage}.communityfridgefinder.com
          CertificateArn: !Ref ApiCertificate
          Route53:
            HostedZoneName: "communityfridgefinder.com." # NOTE: The period at the end is required

  FridgeReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/fridge_reports
      Handler: app.lambda_handler
      Runtime: python3.13
      FunctionName: !Sub FridgeReportFunction${Stage}
      Environment:
        Variables:
          Environment: !Ref Environment
          Stage: !Ref Stage
      Layers:
        - !Ref CommonLayer
      Policies:
        - Version: "2012-10-17"
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource: arn:aws:logs:*:*:*
          - Effect: Allow
            Action:
            - dynamodb:PutItem
            - dynamodb:Query
            Resource: !GetAtt FridgeReportTable.Arn
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            Resource: !GetAtt FridgeTable.Arn
      Events:
        PostFridgeReport:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /v1/fridges/{fridgeId}/reports
            Method: post
            RestApiId:
              Ref: ApiGatewayApi
            RequestParameters:
              - method.request.path.fridgeId:
                  Required: true
                  Caching: false
        GetFridgeReport:
          Type: Api
          Properties:
            Path: /v1/fridges/{fridgeId}/reports
            Method: get
            RestApiId:
              Ref: ApiGatewayApi
            RequestParameters:
              - method.request.path.fridgeId:
                  Required: true
                  Caching: false
        GetFridgeReportHistory:
          Type: Api
          Properties:
            Path: /v1/fridges/{fridgeId}/reports/history
            Method: get
            RestApiId:
              Ref: ApiGatewayApi
            RequestParameters:
              - method.request.path.fridgeId:
                  Required: true
                  Caching: false
        FridgeReportWarmUp:
          Type: Schedule
          Properties:
            # Read more about schedule expressions here:
            # https://docs.aws.amazon.com/AmazonCloudWatch/latest/events/ScheduledEvents.html
            # This event runs every 10 minutes
            Schedule: rate(1 minute)

  GetLatestFridgeReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/fridge_reports/get_latest_fridge_reports
      Handler: app.lambda_handler
      Runtime: python3.13
      FunctionName: !Sub GetLatestFridgeReportsFunction${Stage}
      Environment:
        Variables:
          Environment: !Ref Environment
          Stage: !Ref Stage
      Layers:
        - !Ref CommonLayer
      Policies:
        - Version: "2012-10-17"
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource: arn:aws:logs:*:*:*
          - Effect: Allow
            Action:
            - dynamodb:Scan
            Resource: !GetAtt FridgeTable.Arn
      Events:
        GetLatestFridgeReports:
          Type: Api
          Properties:
            Path: /v1/reports/last
            Method: get
            RestApiId:
              Ref: ApiGatewayApi

  HelloWorldFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      FunctionName: !Sub HelloWorldFunction${Stage}
      CodeUri: functions/dev/hello_world/
      Handler: app.lambda_handler
      Runtime: python3.13
      Layers:
        - !Ref CommonLayer
      Events:
        HelloWorld:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /hello
            Method: get
            RestApiId:
              Ref: ApiGatewayApi
    Description: Responds with 'hello world' if successful.

  FridgesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/fridges/v1
      Handler: app.lambda_handler
      Runtime: python3.13
      FunctionName: !Sub FridgesFunction${Stage}
      Environment:
        Variables:
          Environment: !Ref Environment
          Stage: !Ref Stage
      Layers:
        - !Ref CommonLayer
      Policies:
        - Version: "2012-10-17"
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource: arn:aws:logs:*:*:*
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:Scan
            - dynamodb:PutItem
            Resource: !GetAtt FridgeTable.Arn
      Events:
        GetFridge:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /v1/fridges/{fridgeId}
            Method: get
            RequestParameters:
              - method.request.path.fridgeId:
                  Required: false
                  Caching: false
            RestApiId:
              Ref: ApiGatewayApi
        GetFridges:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /v1/fridges
            Method: get
            RequestParameters:
              - method.request.querystring.tag:
                  Required: false
            RestApiId:
              Ref: ApiGatewayApi
        PostFridge:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /v1/fridges
            Method: post
            RestApiId:
              Ref: ApiGatewayApi
        FridgeWarmUp:
          Type: Schedule
          Properties:
            # Read more about schedule expressions here:
            # https://docs.aws.amazon.com/AmazonCloudWatch/latest/events/ScheduledEvents.html
            # This event runs every 10 minutes
            Schedule: rate(1 minute)

  ExternalFridgesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/fridges/v1
      Handler: app.lambda_handler
      Runtime: python3.13
      FunctionName: !Sub ExternalFridgesFunction${Stage}
      Environment:
        Variables:
          Environment: !Ref Environment
          Stage: !Ref Stage
      Layers:
        - !Ref CommonLayer
      Policies:
        - Version: "2012-10-17"
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource: arn:aws:logs:*:*:*
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:Scan
            Resource: !GetAtt FridgeTable.Arn
      Events:
        ExternalGetFridges:
          Type: Api
          Properties:
            Path: /external/v1/fridges
            Method: get
            RestApiId:
              Ref: ApiGatewayApi

  ImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/image/v1
      Handler: app.lambda_handler
      Runtime: python3.13
      FunctionName: !Sub ImageFunction${Stage}
      Environment:
        Variables:
          Environment: !Ref Environment
          Stage: !Ref Stage
      Layers:
        - !Ref CommonLayer
      Policies:
        - Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource: arn:aws:logs:*:*:*
          - Effect: Allow
            Action:
            - s3:PutObject
            - s3:GetObject
            Resource:
            - !Sub "arn:aws:s3:::${CommunityFridgeMapImages}/*"
            - !Sub "arn:aws:s3:::${CommunityFridgeMapImages}"
      Events:
        UploadImage:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /v1/photo
            Method: post
            RestApiId:
              Ref: ApiGatewayApi
        ImageWarmUp:
          Type: Schedule
          Properties:
            # Read more about schedule expressions here:
            # https://docs.aws.amazon.com/AmazonCloudWatch/latest/events/ScheduledEvents.html
            # This event runs every 10 minutes
            Schedule: rate(10 minutes)

  ContactFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: functions/email_service/v1
      Handler: app.lambda_handler
      FunctionName: !Sub ContactFunction${Stage}
      Environment:
        Variables:
          Environment: !Ref Environment
          Stage: !Ref Stage
      Runtime: python3.13
      Layers:
        - !Ref CommonLayer
      Policies:
        - Version: "2012-10-17"
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource: arn:aws:logs:*:*:*
          - Effect: Allow
            Action:
            - ses:SendEmail
            - ses:SendRawEmail
            Resource:
            - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/fridgefinder.app'
            - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/fridgefinderapp@gmail.com'

      Events:
        SendSESFunction:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /v1/contact
            Method: post
            RestApiId:
              Ref: ApiGatewayApi
        ContactWarmUp:
          Type: Schedule
          Properties:
            # Read more about schedule expressions here:
            # https://docs.aws.amazon.com/AmazonCloudWatch/latest/events/ScheduledEvents.html
            # This event runs every 10 minutes
            Schedule: rate(10 minutes)

  LoadFridgeDataFunction: #FOR DEV TESTING PURPOSES ONLY. TODO: DELETE THIS FUNCTION
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./functions/dev/load_fridge_data
      Handler: app.lambda_handler
      Runtime: python3.13
      FunctionName: !Sub LoadFridgeDataFunction${Stage}
      Environment:
        Variables:
          Environment: !Ref Environment
          Stage: !Ref Stage
      Layers:
        - !Ref CommonLayer
      Policies:
        - Version: "2012-10-17"
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource: arn:aws:logs:*:*:*
          - Effect: Allow
            Action:
            - dynamodb:PutItem
            Resource: !GetAtt FridgeTable.Arn
    ##########################
    ##    Layers    ##
    ##########################
  CommonLayer:
        Type: AWS::Serverless::LayerVersion
        Properties:
            LayerName: !Sub CommunityFridgeMapApiLayer${Stage}
            Description: Dependencies for CommunityFridgeMapApi project
            ContentUri: dependencies/
            CompatibleRuntimes:
              - python3.13
            RetentionPolicy: Delete
  ##########################
  ##   Bucket Policies    ##
  ##########################
  ImageFunctionBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CommunityFridgeMapImages
      PolicyDocument:
        Statement:
          - Action:
              - s3:*
            Effect: Allow
            Resource:
              - !Sub arn:aws:s3:::${CommunityFridgeMapImages}
              - !Sub arn:aws:s3:::${CommunityFridgeMapImages}/*
            Principal:
              AWS:
                - '*'
  ##########################
  ##      S3 Buckets      ##
  ##########################
  CommunityFridgeMapImages:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub community-fridge-map-images-${Stage}
      CorsConfiguration:
        CorsRules:
        - AllowedHeaders:
          - "*"
          AllowedMethods:
          - GET
          - PUT
          - HEAD
          AllowedOrigins:
          - "*"
  ##########################
  ##    DynamoDB Tables    ##
  ##########################

  FridgeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: "id"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "id"
          KeyType: "HASH"
      TableName: !Sub fridge_${Stage}
      BillingMode: "PAY_PER_REQUEST"
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  FridgeReportTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: "fridgeId"
          AttributeType: "S"
        - AttributeName: "epochTimestamp" #epoch time used for querying data
          AttributeType: "N"
      KeySchema:
        - AttributeName: "fridgeId"
          KeyType: "HASH"
        - AttributeName: "epochTimestamp"
          KeyType: "RANGE"
      TableName: !Sub fridge_report_${Stage}
      BillingMode: "PAY_PER_REQUEST"
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  TagTable:
    Type: AWS::DynamoDB::Table
    Properties:

      AttributeDefinitions:
        - AttributeName: "tag_name"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "tag_name"
          KeyType: "HASH"
      TableName: !Sub tag_${Stage}
      BillingMode: "PAY_PER_REQUEST"

  FridgeHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: "fridgeId"
          AttributeType: "S"
        - AttributeName: "epochTimestamp" #epoch time used for querying data
          AttributeType: "N"
      KeySchema:
        - AttributeName: "fridgeId"
          KeyType: "HASH"
        - AttributeName: "epochTimestamp"
          KeyType: "RANGE"
      TableName: !Sub fridge_history_${Stage}
      BillingMode: "PAY_PER_REQUEST"

  ##########################
  ##    EventBridge        ##
  ##########################
  FridgeReportEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub FridgeReportEventBus-${Stage}

  FridgePipeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/pipes/FridgeTableStreamPipe-${Stage}
      RetentionInDays: 30

  ##########################
  ##    Pipe IAM Role      ##
  ##########################
  FridgePipeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub FridgePipeRole-${Stage}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: pipes.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FridgePipePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:DescribeStream
                  - dynamodb:ListStreams
                Resource: !GetAtt FridgeTable.StreamArn
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: !GetAtt FridgeReportEventBus.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt FridgePipeLogGroup.Arn

  ##########################
  ##    EventBridge Pipe   ##
  ##########################
  FridgeTableStreamPipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Name: !Sub FridgeTableStreamPipe-${Stage}
      RoleArn: !GetAtt FridgePipeRole.Arn
      Source: !GetAtt FridgeTable.StreamArn
      SourceParameters:
        DynamoDBStreamParameters:
          StartingPosition: LATEST
          BatchSize: 1
        FilterCriteria:
          Filters:
            # Only forward MODIFY events — new fridge reports trigger an UpdateItem on FridgeTable
            - Pattern: '{"eventName": ["MODIFY"]}'
      Target: !GetAtt FridgeReportEventBus.Arn
      LogConfiguration:
        Level: ERROR
        CloudwatchLogsLogDestination:
          LogGroupArn: !GetAtt FridgePipeLogGroup.Arn
      TargetParameters:
        EventBridgeEventBusParameters:
          DetailType: FridgeReportUpdated
          Source: cfm.fridge
        InputTemplate: |
          {
            "newReport": "<$.dynamodb.NewImage.latestFridgeReport.S>",
            "previousReport": "<$.dynamodb.OldImage.latestFridgeReport.S>"
          }


Outputs:
  HelloWorldFunction:
    Description: "Hello World Lambda Function ARN"
    Value: !GetAtt HelloWorldFunction.Arn
  HelloWorldFunctionIamRole:
    Description: "Implicit IAM Role created for Hello World function"
    Value: !GetAtt HelloWorldFunctionRole.Arn
  FridgeReportTableStreamArn:
    Description: "DynamoDB Stream ARN for FridgeReportTable"
    Value: !GetAtt FridgeReportTable.StreamArn
    Export:
      Name: !Sub FridgeReportStreamArn-${Stage}
  FridgeReportEventBusName:
    Description: "EventBridge bus name — import this in consuming services to add rules"
    Value: !Ref FridgeReportEventBus
    Export:
      Name: !Sub FridgeReportEventBusName-${Stage}
  FridgeReportEventBusArn:
    Description: "EventBridge bus ARN — import this in consuming services to put events or add rules"
    Value: !GetAtt FridgeReportEventBus.Arn
    Export:
      Name: !Sub FridgeReportEventBusArn-${Stage}
